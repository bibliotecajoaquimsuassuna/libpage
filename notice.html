<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula Iniciando</title>
    <style>
        body {
            font-family: 'Poppins', 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #eaf3fa, #ffffff);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }

        .alert-box {
            text-align: center;
            background: #ffffff;
            padding: 35px 55px;
            border-radius: 16px;
            border: 3px solid #1576BD;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
            max-width: 650px;
        }

        .icon {
            font-size: 3rem;
            margin-bottom: 10px;
            color: #1576BD;
        }

        h1 {
            color: #1576BD;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.25rem;
            line-height: 1.5;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="alert-box">
        <div class="icon">📚⏰</div>
        <h1>A aula vai começar!</h1>
        <p>
            Durante a próxima 1 hora, não será permitido jogar. 🎮❌<br><br>
            Depois da aula, vocês poderão voltar a jogar normalmente. 🙌
        </p>
    </div>
</body>
</html>
